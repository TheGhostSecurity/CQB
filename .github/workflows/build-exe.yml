name: Build Windows EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name CQB_Trainer cqb_game.py
      - uses: actions/upload-artifact@v4
        with:
          name: CQB_Trainer_windows
          path: dist/CQB_Trainer.exe
